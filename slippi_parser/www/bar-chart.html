    <select id="graph-dropdown" onchange="showSelectedGraph()">
        <option value="graph1">Character Combo Rates</option>
        <option value="graph2">Move Combo Rates</option>
    </select>
    
    <!-- Graph 1 Section -->
    <div id="graph1-section">
      <div style="width: 80%;">
        <canvas id="bar-chart1"></canvas>
      </div>
    </div>

    <!-- Graph 2 Section -->
    <div id="graph2-section" style="display: none;">
      <div style="width: 80%;">
        <!-- Search bar -->
        <input type="text" id="search-input" placeholder="Enter Character+Move">
        <br><br>
        <canvas id="bar-chart2"></canvas>
      </div>
    </div>
  </div>

      var selectedGraph = document.getElementById("graph-dropdown").value;
      if (selectedGraph === "graph1") {
        document.getElementById("graph1-section").style.display = "block";
        document.getElementById("graph2-section").style.display = "none";
      } else if (selectedGraph === "graph2") {
        document.getElementById("graph1-section").style.display = "none";
        document.getElementById("graph2-section").style.display = "block";

    }

    // Parse CSV data
    const rows = csvData1.split('\n').slice(1); // Remove header
    const data = rows.map(row => {
      const [character, hitRate, attempts] = row.trim().split('	');
      return { character, hitRate: parseFloat(hitRate)*100, attempts: parseInt(attempts) };
    });

    // Extract labels and data for Chart.js
    const labels = data.map(entry => entry.character);
    const hitRates = data.map(entry => entry.hitRate);

    // Create canvas context
    const ctx = document.getElementById('bar-chart1').getContext('2d');

    function charNameToColor(data){
        const colors = [];
        data.forEach(entry => {
            if (entry.character === "Mario"||entry.character ==="Ness") {
                colors.push('#e31a1c'); //red
            }else if(entry.character ==="Fox"||entry.character ==="DrMario"){
                colors.push('#cab2d6'); //light purple/blue
            }else if(entry.character ==="CaptainFalcon"||entry.character ==="Falco"){
                colors.push('#1f78b4'); //dark blue
            }else if(entry.character ==="DonkeyKong"||entry.character ==="GameAndWatch"){
                colors.push('#b15928'); //brown
            }else if(entry.character ==="Kirby"||entry.character ==="Jigglypuff"||entry.character ==="Peach"){
                colors.push('#fb9a99'); //pink
            }else if(entry.character ==="Bowser"||entry.character ==="Luigi"||entry.character ==="Yoshi"){
                colors.push('#33a02c'); //green
            }else if(entry.character ==="Link"||entry.character ==="YoungLink"){
                colors.push('#b2df8a'); //light green
            }else if(entry.character ==="Sheik"||entry.character ==="IceClimbers"){
                colors.push('#a6cee3'); //light blue
            }else if(entry.character ==="Mewtwo"||entry.character ==="Ganondorf"){
                colors.push('#6a3d9a'); //purple
            }else if(entry.character ==="Samus"||entry.character ==="Marth"){
                colors.push('#ff7f00'); //orange
            }else if(entry.character ==="Roy"||entry.character ==="Zelda"){
                colors.push('#fdbf6f'); //light orange
            }else if(entry.character ==="Pikachu"||entry.character ==="Pichu"){
                colors.push('#ffff99'); //yellow
            }else {
                colors.push('rgba(54, 162, 235, 0.6)'); // Default color for others
            }
        });
        return colors;
    }

    // Create bar chart
    const barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Combo Rate',
          data: hitRates,
          backgroundColor: charNameToColor(data),
          borderColor: charNameToColor(data),
          borderWidth: 1
        }]
      },
      options: {
        plugins: {
            zoom: {
                zoom: {
                    wheel: {
                        enabled: true,
                    },
                    pinch: {
                        enabled: true
                    },
                    mode: 'x',
                }
            },
            tooltip: {
                callbacks: {
                label: function(context) {
                    const index = context.dataIndex;
                    const entry = data[index];
                    return `${entry.hitRate.toFixed(2)}% combo rate on ${entry.attempts} hits`;
                }
                }
            }
        },

            /*
          x: {
            display: false // Hides the x-axis labels
          },
          */
          y: {

            ticks: {
              stepSize: 10,
              callback: function(value) {
                return value + '%';
              }
            },
            title: {
                display: true,
                text: 'Combo Rate (%)'
            }
          }
        }

    });

      type: 'bar',
      data: {
        labels: labels2,
        datasets: [{
          label: 'Combo Rate',
          data: hitRates2,
          backgroundColor: charNameToColor(data2),
          borderColor: charNameToColor(data2),
          borderWidth: 1
        }]
      },

        plugins: {
            zoom: {
                pan: {
                  enabled: true,
                  mode: 'x',
                },
                zoom: {
                    wheel: {
                        enabled: true,
                    },
                    pinch: {
                        enabled: true
                    },
                    mode: 'x',
                }
            },
            tooltip: {
                callbacks: {
                label: function(context) {
                    const index = context.dataIndex;
                    const label = barChart2.data.labels[index];
                    const realIndex = labels2.indexOf(label);
                    const entry = data2[realIndex];
                    return `${entry.hitRate.toFixed(2)}% combo rate on ${entry.attempts} hits`;
                }
                }
            }
        },
        scales: {
          x: {
            display: false // Hides the x-axis labels
          },
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 10,
              callback: function(value) {
                return value + '%';
              }
            },
            title: {
                display: true,
                text: 'Combo Rate (%)'
            }
          }
        }
      }
    });

    // Function to filter data based on search input
    function filterData(searchValue) {
      const filteredData = data2.filter(entry =>
        (entry.character+" "+entry.move.toLowerCase()).toLowerCase().includes(searchValue.toLowerCase())
      );
      const filteredLabels = filteredData.map(entry => `${entry.character} ${entry.move}`);
      const filteredHitRates = filteredData.map(entry => entry.hitRate);
      // Update chart data
      barChart2.data.labels = filteredLabels;
      barChart2.data.datasets[0].data = filteredHitRates;
      const filteredColors = charNameToColor(filteredData);
      barChart2.data.datasets[0].backgroundColor = filteredColors;
      barChart2.data.datasets[0].borderColor = filteredColors;
      barChart2.update();
    }

    // Add event listener to search input
    document.getElementById('search-input').addEventListener('input', function(event) {
      filterData(event.target.value);
    });
